name: CI

on:
  push:
    branches: [master, daily/*, fix/*, feature/*]
  pull_request:
    branches: [master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: P0 — Compileall smoke
        run: python3 -m py_compile $(find . -name "*.py" -not -path "*/test*" -not -path "*/.pip-packages/*" -not -path "*/__pycache__/*")

      - name: P1 — Pytest
        run: pytest tests/ -q --tb=short

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: P2 — Benchmark smoke
        run: |
          python3 benchmarks/run.py --quick

  depth-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Tree depth sensitivity sweep
        run: |
          python3 benchmarks/run.py --depth-sweep

      - name: Upload depth sweep report
        uses: actions/upload-artifact@v4
        with:
          name: depth-sweep-report
          path: benchmarks/reports/depth_sweep_*.json
          retention-days: 30

  hyperparam-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Hyperparameter sweep regression detection
        run: |
          python3 benchmarks/run.py --hyperparam-sweep --hyperparam-baseline benchmarks/hyperparam_baseline.json
        # Fails if regressions > 0 (any sweep config drops >5% vs stored best-known baseline)

      - name: Upload hyperparam sweep report
        uses: actions/upload-artifact@v4
        with:
          name: hyperparam-sweep-report
          path: benchmarks/reports/hyperparam_sweep_*.json
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Security audit — pip-audit
        run: |
          pip-audit -r requirements.lock -f columns

  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check README/SPEC.md consistency
        run: |
          python3 scripts/check_readme_consistency.py