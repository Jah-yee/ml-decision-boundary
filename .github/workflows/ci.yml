name: CI

on:
  push:
    branches: [master, daily/*, fix/*, feature/*]
  # No 'branches:' filter on purpose.
  #
  # A 'branches: [master]' filter means CI runs ONLY for pull requests whose
  # base is master.  A *stacked* pull request -- one targeting another
  # feature branch -- then produces ZERO checks: the workflow never starts.
  # That gap is invisible in the PR list (an empty check list looks similar
  # to "still running") but it means the code is never verified by CI.
  #
  # This repository hit exactly that: PR #63 (base feat/v13-replay-provenance)
  # accumulated no CI run at all, while PRs #60/#61/#62 (base master) each got
  # the full 6-job suite.  The invariant "every pull request is verified" is
  # now enforced by scripts/ci_trigger_audit.py, which runs as the
  # ci-trigger-audit job below and fails the build if a 'branches:' filter
  # ever narrows the pull_request trigger again.
  pull_request:

# Least-privilege token scopes.
#
# Without this block the workflow inherits the repository's default
# token permission, which is 'read and write' on many repositories --
# so every CI job would run with write access to the repo even though
# none of them writes anything.  Declaring the scopes explicitly is
# what makes the token *read-only*.
#
# 'contents: read'    -- actions/checkout needs to read the repository.
# 'pull-requests: read' -- pr-coverage-audit / pr-coverage-gate read
#                         pull requests through 'gh' with GITHUB_TOKEN.
#
# No 'write' scope is granted: no CI job pushes, comments, or releases.
permissions:
  contents: read
  pull-requests: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-trigger-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails the build if the pull_request trigger is ever narrowed by a
      # 'branches:' filter again, which would silently leave stacked pull
      # requests (base = another feature branch) with zero CI checks.
      - name: Audit CI trigger coverage
        run: python3 scripts/ci_trigger_audit.py

  # DoD #8 — the pull-request-level counterpart of the audit above.
  #
  # scripts/ci_trigger_audit.py asks "would CI run for a PR with base X?"
  # about the workflow on *this* branch.  That is not what GitHub decides.
  # GitHub reads workflow definitions from a pull request's HEAD branch,
  # so a stacked PR whose head branch still carries an old filtered
  # workflow stays unverified no matter what this branch looks like.
  #
  # PR #63 was exactly that case: it accumulated zero CI runs, and the
  # fix for it (PR #66) was stacked on top of it, so GitHub never
  # previewed the fix downwards.
  #
  # This job audits every open pull request against the workflow on *its*
  # head branch and fails the build if any of them would never be
  # verified.  Like the job above it does NOT install requirements.lock:
  # a guard must not depend on the environment it guards.
  #
  # The head-branch workflow is fetched from the GitHub Contents API, so
  # this job does NOT depend on the runner having the other pull
  # requests' branches in its local ref store.  The first version of this
  # job read them from local git and failed on PR #67 (run 41265562901):
  # a 'pull_request' event checks out a detached merge commit, so every
  # *other* pull request's head branch was simply absent, and the guard
  # reported 0/6 verified -- turning the proof into the failure.
  pr-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Full history so the local-git fallback path can read each
          # pull request's head branch when the API is unreachable.
          fetch-depth: 0

      - name: Fetch all branches (fallback for the local-git reader)
        # The API is the primary source; this only makes the offline
        # fallback work too.  'git fetch origin' on a pull_request event
        # fetches the merge ref only, which is why the fallback used to
        # be useless on a runner.
        run: |
          git fetch --no-tags --prune \
            origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit pull request CI coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/pr_coverage_audit.py

  # DoD #18 — audit the *inside* of the workflow: the job dependency
  # graph.  Every previous audit (DoD #7/#8/#16/#17) asks a question
  # *about* the workflow -- would it trigger, is every PR covered, is
  # the gate monotonic, can the stack be merged.  None of them looks
  # at the ``jobs:`` block and asks whether the job graph itself is
  # sound.
  #
  # Three concrete defects this catches:
  # 1. A dangling ``needs:`` target kills the *entire* workflow -- a
  #    one-character typo turns a green CI into a CI that verifies
  #    nothing, and it does so loudly on the PR that introduced it.
  # 2. A ``needs:`` cycle makes jobs silently never run.
  # 3. An ungated verification job makes the gate *lie* -- the exact
  #    analogue of the DoD #16 defect (a stricter gate that was laxer
  #    than the default).  This is why the audit is a *gate* rather
  #    than a lint: a gate that does not fail on the defect it exists
  #    to catch is a rubber stamp.
  #
  # Like ci-trigger-audit this job installs no third-party packages:
  # the audit uses only the Python standard library.
  job-graph-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit job dependency graph
        run: python3 scripts/job_graph_audit.py

  # Audit the release pipeline itself.
  #
  # Every other audit in this workflow deliberately excludes
  # `.github/workflows/release.yml`: a tag-driven publish pipeline is
  # not supposed to run on pull requests, so auditing it in the PR
  # path would be noise.  The consequence is that the one job holding
  # `contents: write` and producing the shipped artefact had **no
  # audit at all** -- and this repository has never been tagged, so the
  # release path had never executed even once.  Its very first step
  # was known to fail on a tagless repository.
  #
  # The audit is read-only and hermetic: it parses the workflow and
  # reports; it never touches the network, the git history or the
  # repository.  It installs no third-party packages.
  release-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit release pipeline
        # The invocation deliberately names **no** workflow file.  An
        # earlier version of this job passed '--workflow
        # .github/workflows/release.yml', which narrowed the audit to
        # one of the repository's two workflows -- so the job that was
        # supposed to guard the workflows never examined ci.yml, the
        # workflow that holds eleven jobs, the pull-request gate and
        # the token permissions.
        #
        # The defect was measurable: deleting the 'permissions:' block
        # from ci.yml left this job exiting 0 while ci.yml's token
        # inherited the repository's default (often read-write)
        # permission.  The auditor itself *could* catch the defect;
        # the invocation never pointed it at the file.
        #
        # scripts/audit_coverage_audit.py now guards this: it verifies
        # that every audit invocation in this workflow covers every
        # workflow file, so narrowing cannot be reintroduced silently.
        run: python3 scripts/release_audit.py --strict

  # Audit the *coverage* of the audits above.
  #
  # Every other audit in this workflow answers a question about an
  # artifact: would this workflow trigger, is this pull request
  # covered, is the job graph sound, is the release pipeline safe.
  # This one asks a question about the audits themselves: **when an
  # audit job runs, which artifacts does it actually look at?**
  #
  # The distinction matters because an audit that runs green while
  # narrowly scoped produces exactly the wrong signal -- it says "this
  # area is verified" when the truth is "this area was never looked
  # at".
  #
  # The concrete instance this job exists for: the release-audit job
  # used to pass '--workflow .github/workflows/release.yml', which
  # narrowed it to one of the repository's two workflows.  Measured on
  # 2026-11-07: deleting the 'permissions:' block from ci.yml left
  # EVERY audit in this repository exiting 0 -- the security defect
  # the previous round had just fixed had no guard at all.
  #
  # So this job makes the narrowing itself a defect.  It verifies that
  # every audit invocation in this workflow covers every workflow file,
  # and it fails the build when one does not.
  #
  # Like the other guard jobs it installs no third-party packages: the
  # audit uses only the Python standard library.
  audit-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit the coverage of the audit jobs
        run: python3 scripts/audit_coverage_audit.py --strict

  # The strict CI gate for *this* pull request.
  #
  # It is a separate job rather than a step inside pr-coverage-audit on
  # purpose.  "have the checks finished?" is only answerable *after* the
  # sibling jobs are done -- and the jobs run in parallel, so a step in
  # pr-coverage-audit would observe its siblings still running and fail
  # the build for the wrong reason.  (Measured on run 41314763785:
  # pr-coverage-audit finished at 14:09:38, hyperparam-sweep at
  # 14:11:11 -- 93 seconds later.)  `needs:` makes the ordering
  # explicit instead of leaving it to luck.
  #
  # The default audit in pr-coverage-audit asks a different question:
  # "is every open pull request covered by CI, and has CI reported for
  # it?"  This job asks the sharper one: "did this pull request's CI
  # actually run to completion?"
  pr-coverage-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ci-trigger-audit
      - pr-coverage-audit
      - job-graph-audit
      - release-audit
      - audit-coverage-audit
      - quality-gates
      - benchmark
      - depth-sweep
      - hyperparam-sweep
      - security-audit
      - quality-checks

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This job gates a *pull request*, so it only makes sense on a
      # pull_request event.  On a push (the other trigger of this
      # workflow) there is no pull request to gate, so the job reports
      # success and stops.  Without this guard the empty PR number would
      # reach argparse and fail the build for the wrong reason.
      - name: Skip when there is no pull request
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "::notice::Not a pull_request event -- nothing to gate."
          exit 0

      - name: Gate — this pull request must have *finished* checks
        if: ${{ github.event_name == 'pull_request' }}
        # GitHub creates a check run as soon as a workflow starts, so
        # "a check exists" and "a check ran to completion" are
        # different facts -- and only the second one is evidence that
        # CI verified this code.
        #
        # The strict mode's requirements are a strict *superset* of the
        # default mode's (see scripts/pr_coverage_audit.py), so this
        # gate can only ever turn a pass into a failure, never the
        # other way round.  That is the property this job relies on.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/pr_coverage_audit.py --pr "$PR_NUMBER" --require-checks

  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: P0 — Compileall smoke
        run: python3 -m py_compile $(find . -name "*.py" -not -path "*/test*" -not -path "*/.pip-packages/*" -not -path "*/__pycache__/*")

      - name: P1 — Pytest
        run: pytest tests/ -q --tb=short

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: P2 — Benchmark smoke
        run: |
          python3 benchmarks/run.py --quick

  depth-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Tree depth sensitivity sweep
        run: |
          python3 benchmarks/run.py --depth-sweep

      - name: Upload depth sweep report
        uses: actions/upload-artifact@v4
        with:
          name: depth-sweep-report
          path: benchmarks/reports/depth_sweep_*.json
          retention-days: 30

  hyperparam-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Hyperparameter sweep regression detection
        run: |
          python3 benchmarks/run.py --hyperparam-sweep --hyperparam-baseline benchmarks/hyperparam_baseline.json
        # Fails if regressions > 0 (any sweep config drops >5% vs stored best-known baseline)

      - name: Upload hyperparam sweep report
        uses: actions/upload-artifact@v4
        with:
          name: hyperparam-sweep-report
          path: benchmarks/reports/hyperparam_sweep_*.json
          retention-days: 30

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Security audit — pip-audit
        run: |
          pip-audit -r requirements.lock -f columns

  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.lock'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Check README/SPEC.md consistency
        run: |
          python3 scripts/check_readme_consistency.py