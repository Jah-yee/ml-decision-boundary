name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate changelog
        id: changelog
        run: |
          # Resolve the *previous* release tag.  Two edge cases matter:
          #   1. the very first release has no previous tag at all;
          #   2. `git describe --tags` alone would resolve to the tag
          #      being released (HEAD), not to the previous one.
          CURRENT_TAG=$(git tag --points-at HEAD | head -1)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1 || true)
          python3 scripts/generate_changelog.py --since "$PREV_TAG" --dry-run > /tmp/changelog_body.md
          echo "body_file=/tmp/changelog_body.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: ${{ steps.changelog.outputs.body_file }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md for released version
        run: |
          TAG_NAME=${GITHUB_REF_NAME}
          CURRENT_TAG=$(git tag --points-at HEAD | head -1)
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${CURRENT_TAG}$" | head -1 || true)
          python3 scripts/generate_changelog.py --since "$PREV_TAG" --output CHANGELOG_NEW.md
          # Insert version header and merge with existing
          {
            echo "# Changelog"
            echo ""
            echo "## [$TAG_NAME] - $(date +%Y-%m-%d)"
            echo ""
            cat CHANGELOG_NEW.md
            echo ""
            tail -n +3 CHANGELOG.md | head -n 500  # Skip header lines and unreleased
          } > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
          rm -f CHANGELOG_NEW.md

      - name: Commit CHANGELOG update
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          commit_message: "docs: update CHANGELOG for ${{ github.ref_name }}"
          file_pattern: CHANGELOG.md
          skip_dirty: false